<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Debug Panel</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        display: flex;
        height: 100vh;
      }

      .left {
        width: 40%;
        padding: 20px;
        overflow-y: auto;
        border-right: 1px solid #ccc;
      }

      .right {
        width: 60%;
        padding: 20px;
        background: #f5f5f5;
        overflow-y: auto;
      }

      h2 {
        margin-top: 30px;
      }

      form {
        margin-bottom: 15px;
      }

      input {
        margin-bottom: 5px;
        width: 100%;
        padding: 5px;
      }

      button {
        padding: 5px 10px;
        cursor: pointer;
      }

      #output {
        white-space: pre-wrap;
        font-family: monospace;
        background: #111;
        color: #0f0;
        padding: 15px;
        border-radius: 5px;
      }

      .log-entry {
        white-space: pre-wrap;
      }
    </style>
  </head>

  <body>
    <!-- LEFT: acciones -->
    <div class="left">
      <h1>Debug Panel</h1>

      <h2>Create User</h2>
      <form onsubmit="submitForm(event, '/api/debug/create-user')">
        <input name="username" placeholder="Username" />
        <input name="email" placeholder="Email" />
        <input name="password" type="password" placeholder="Password" />
        <button type="submit">Create</button>
      </form>

      <h2>Find User</h2>
      <form onsubmit="submitForm(event, '/api/debug/user', 'GET')">
        <input name="email" placeholder="Email" />
        <button type="submit">Find</button>
      </form>

      <h2>Create Character</h2>
      <form onsubmit="submitForm(event, '/api/debug/create-character')">
        <input name="email" placeholder="Email" />
        <input name="name" placeholder="Character name" />
        <button type="submit">Create</button>
      </form>

      <h2>View Character</h2>
      <form onsubmit="submitForm(event, '/api/debug/character', 'GET')">
        <input name="email" placeholder="Email" />
        <button type="submit">View</button>
      </form>

      <h2>Gain XP</h2>
      <form onsubmit="submitForm(event, '/api/debug/gain-xp')">
        <input name="email" placeholder="Email" />
        <input name="amount" type="number" min="1" placeholder="XP amount" />
        <button type="submit">Gain</button>
      </form>

      <h2>Train</h2>
      <form onsubmit="submitForm(event, '/api/debug/train')">
        <input name="email" placeholder="Email" />
        <select name="stat">
          <option value="str">Strength</option>
          <option value="int">Intelligence</option>
          <option value="agi">Agility</option>
          <option value="luck">Luck</option>
        </select>

        <button type="submit">Train</button>
      </form>

      <h2>Restore Energy</h2>
      <form onsubmit="submitForm(event, '/api/debug/restore-energy')">
        <input name="email" placeholder="Email" />
        <button type="submit">Restore</button>
      </form>

      <h2>Add Gold</h2>
      <form onsubmit="submitForm(event, '/api/debug/add-gold')">
        <input name="email" placeholder="Email" />
        <input name="amount" type="number" min="1" placeholder="Gold" />
        <button type="submit">Add</button>
      </form>
      <hr />

      <h2>Add Strength</h2>
      <form onsubmit="submitForm(event, '/api/debug/add-strength')">
        <input name="email" placeholder="User Email" />
        <input name="amount" type="number" min="1" placeholder="Amount" />
        <button type="submit">Add STR</button>
      </form>

      <h2>Add Intelligence</h2>
      <form onsubmit="submitForm(event, '/api/debug/add-intelligence')">
        <input name="email" placeholder="User Email" />
        <input name="amount" type="number" min="1" placeholder="Amount" />
        <button type="submit">Add INT</button>
      </form>

      <h2>Add Agility</h2>
      <form onsubmit="submitForm(event, '/api/debug/add-agility')">
        <input name="email" placeholder="User Email" />
        <input name="amount" type="number" min="1" placeholder="Amount" />
        <button type="submit">Add AGI</button>
      </form>

      <h2>Add Luck</h2>
      <form onsubmit="submitForm(event, '/api/debug/add-luck')">
        <input name="email" placeholder="User Email" />
        <input name="amount" type="number" min="1" placeholder="Amount" />
        <button type="submit">Add LUCK</button>
      </form>

      <h2>Combat</h2>
      <form onsubmit="submitForm(event, '/api/debug/combat')">
        <input name="attackerEmail" placeholder="Attacker email" />
        <input name="defenderEmail" placeholder="Defender email" />
        <button type="submit">Fight</button>
      </form>

      <h2>Combat vs Preset</h2>
      <form onsubmit="submitForm(event, '/api/debug/combat-preset')">
        <input name="attackerEmail" placeholder="Attacker email" />
        <select name="enemyType">
          <option value="recruit">Recruit - balanced</option>
          <option value="skirmisher">Skirmisher - mixed mid-tier</option>
          <option value="brute">Brute - high STR</option>
          <option value="duelist">Duelist - high AGI</option>
          <option value="gambler">Gambler - high LUCK</option>
          <option value="veteran">Veteran - mixed level 3</option>
        </select>
        <button type="submit">Fight Preset</button>
      </form>
    </div>

    <!-- RIGHT: output -->
    <div class="right">
      <h2>Output</h2>
      <div id="output" data-empty="true">Aqui apareceran los resultados...</div>
    </div>

    <script>
      function appendOutput(text) {
        const output = document.getElementById("output");

        if (output.dataset.empty === "true") {
          output.replaceChildren();
          output.dataset.empty = "false";
        }

        const entry = document.createElement("div");
        entry.className = "log-entry";
        entry.textContent = text;

        if (output.firstChild) {
          output.prepend(document.createElement("hr"));
        }

        output.prepend(entry);
      }

      async function submitForm(event, url, method = "POST") {
        event.preventDefault();

        const form = event.target;
        const data = new FormData(form);
        const params = new URLSearchParams(data);

        let response;

        try {
          if (method === "GET") {
            response = await fetch(url + "?" + params.toString());
          } else {
            response = await fetch(url, {
              method: "POST",
              body: params,
            });
          }

          appendOutput(await response.text());
        } catch (err) {
          appendOutput("Error: " + err);
        }
      }
    </script>
  </body>
</html>
