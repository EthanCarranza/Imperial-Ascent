<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Debug Panel</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        display: flex;
        height: 100vh;
      }

      .left {
        width: 40%;
        padding: 20px;
        overflow-y: auto;
        border-right: 1px solid #ccc;
      }

      .right {
        width: 60%;
        padding: 20px;
        background: #f5f5f5;
        overflow-y: auto;
      }

      h2 {
        margin-top: 30px;
      }

      form {
        margin-bottom: 15px;
      }

      input {
        margin-bottom: 5px;
        width: 100%;
        padding: 5px;
      }

      button {
        padding: 5px 10px;
        cursor: pointer;
      }

      #output {
        white-space: pre-wrap;
        font-family: monospace;
        background: #111;
        color: #0f0;
        padding: 15px;
        border-radius: 5px;
      }
    </style>
  </head>

  <body>
    <!-- LEFT: acciones -->
    <div class="left">
      <h1>Debug Panel</h1>

      <h2>Create User</h2>
      <form onsubmit="submitForm(event, '/api/debug/create-user')">
        <input name="username" placeholder="Username" />
        <input name="email" placeholder="Email" />
        <input name="password" placeholder="Password" />
        <button type="submit">Create</button>
      </form>

      <h2>Find User</h2>
      <form onsubmit="submitForm(event, '/api/debug/user', 'GET')">
        <input name="email" placeholder="Email" />
        <button type="submit">Find</button>
      </form>

      <h2>Create Character</h2>
      <form onsubmit="submitForm(event, '/api/debug/create-character')">
        <input name="email" placeholder="Email" />
        <input name="name" placeholder="Character name" />
        <button type="submit">Create</button>
      </form>

      <h2>View Character</h2>
      <form onsubmit="submitForm(event, '/api/debug/character', 'GET')">
        <input name="email" placeholder="Email" />
        <button type="submit">View</button>
      </form>

      <h2>Gain XP</h2>
      <form onsubmit="submitForm(event, '/api/debug/gain-xp')">
        <input name="email" placeholder="Email" />
        <input name="amount" type="number" placeholder="XP amount" />
        <button type="submit">Gain</button>
      </form>

      <h2>Train</h2>
      <form onsubmit="submitForm(event, '/api/debug/train')">
        <input name="email" placeholder="Email" />
        <button type="submit">Train</button>
      </form>

      <h2>Restore Energy</h2>
      <form onsubmit="submitForm(event, '/api/debug/restore-energy')">
        <input name="email" placeholder="Email" />
        <button type="submit">Restore</button>
      </form>

      <h2>Add Gold</h2>
      <form onsubmit="submitForm(event, '/api/debug/add-gold')">
        <input name="email" placeholder="Email" />
        <input name="amount" type="number" placeholder="Gold" />
        <button type="submit">Add</button>
      </form>
    </div>

    <!-- RIGHT: output -->
    <div class="right">
      <h2>Output</h2>
      <div id="output">Aquí aparecerán los resultados...</div>
    </div>

    <script>
      async function submitForm(event, url, method = "POST") {
        event.preventDefault();

        const form = event.target;
        const data = new FormData(form);
        const params = new URLSearchParams(data);

        let response;

        try {
          if (method === "GET") {
            response = await fetch(url + "?" + params.toString());
          } else {
            response = await fetch(url, {
              method: "POST",
              body: params,
            });
          }

          const text = await response.text();
          document.getElementById("output").innerText = text;
        } catch (err) {
          document.getElementById("output").innerText = "Error: " + err;
        }
      }
    </script>
  </body>
</html>
