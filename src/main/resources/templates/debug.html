<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Debug Panel</title>
  </head>
  <body>
    <h1>Byzantine Debug Panel</h1>

    <p>Si ves esto, Thymeleaf funciona 👍</p>

    <hr />

    <h2>Create User</h2>

    <input id="username" placeholder="username" />
    <input id="email" placeholder="email" />
    <input id="password" placeholder="password" />

    <button onclick="createUser()">Create User</button>

    <hr />

    <h2>Get User</h2>

    <input id="searchEmail" placeholder="email to search" />
    <button onclick="getUser()">Get User</button>

    <hr />

    <h2>Result</h2>
    <pre id="result"></pre>

    <script>
      async function createUser() {
        const username = document.getElementById("username").value;
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        const res = await fetch(
          `/api/debug/create-user?username=${username}&email=${email}&password=${password}`,
          { method: "POST" },
        );

        const data = await res.json();

        document.getElementById("result").textContent = JSON.stringify(
          data,
          null,
          2,
        );
      }

      async function getUser() {
        const email = document.getElementById("searchEmail").value;

        const res = await fetch(`/api/debug/user?email=${email}`);
        const data = await res.json();

        document.getElementById("result").textContent = JSON.stringify(
          data,
          null,
          2,
        );
      }
    </script>
  </body>
</html>
